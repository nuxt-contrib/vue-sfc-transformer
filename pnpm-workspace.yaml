catalogMode: prefer
minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - '@octokit/action@6.1.0'
  - '@octokit/endpoint@9.0.6'
  - '@octokit/plugin-paginate-rest@9.2.0'
  - chokidar@4.0.3
  - undici@5.29.0 || 6.22.0

shellEmulator: true

packages:
  - playground

overrides:
  '@vue/compiler-core': 3.5.45
  vue-sfc-transformer: 'workspace:*'

allowBuilds:
  '@parcel/watcher': false
  simple-git-hooks: true

catalogs:
  dev:
    '@antfu/eslint-config': 9.5.1
    '@babel/types': 7.29.11
    '@types/node': 26.6.6
    '@vitest/coverage-v8': 5.1.0
    '@volar/typescript': 2.4.31
    '@vue/compiler-dom': 3.5.45
    '@vue/compiler-sfc': 3.5.45
    '@vue/language-core': 3.3.14
    eslint: 10.14.0
    exsolve: 1.2.0
    installed-check: 11.0.0
    knip: 6.44.2
    lint-staged: 17.6.0
    mkdist: 2.4.1
    pkg-pr-new: 0.0.93
    rolldown: 1.3.0
    simple-git-hooks: 2.14.0
    tsdown: 0.23.7
    typescript: 6.0.3
    vitest: 5.1.0
    vue-tsc: 3.3.14
  peer:
    '@vue/compiler-core': 3.5.45
    vue: 3.5.45
  prod:
    petrea: ^0.5.1
    tinyglobby: ^0.2.16
