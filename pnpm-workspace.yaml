catalogMode: prefer
shellEmulator: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - '@octokit/action@6.1.0'
  - '@octokit/endpoint@9.0.6'
  - '@octokit/plugin-paginate-rest@9.2.2'
  - chokidar@4.0.3
  - undici@5.29.0 || 6.22.0
packages:
  - playground
overrides:
  '@vue/compiler-core': 3.5.44
  vue-sfc-transformer: 'workspace:*'
catalogs:
  dev:
    '@antfu/eslint-config': 9.5.1
    '@babel/types': 7.29.11
    '@types/node': 24.19.2
    '@vitest/coverage-v8': 5.0.5
    '@volar/typescript': 2.4.30
    '@vue/compiler-dom': 3.5.44
    '@vue/compiler-sfc': 3.5.44
    '@vue/language-core': 3.3.14
    eslint: 10.13.0
    exsolve: 1.2.0
    installed-check: 11.0.0
    knip: 6.43.0
    lint-staged: 17.6.0
    mkdist: 2.4.1
    pkg-pr-new: 0.0.93
    rolldown: 1.2.16
    simple-git-hooks: 2.14.0
    tsdown: 0.23.4
    typescript: 6.0.3
    vitest: 5.0.5
    vue-tsc: 3.3.14
  peer:
    '@vue/compiler-core': 3.5.44
    esbuild: 0.28.2
    vue: 3.5.44
  prod:
    tinyglobby: ^0.2.16

allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  simple-git-hooks: true
