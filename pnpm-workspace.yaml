catalogMode: prefer
shellEmulator: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - '@octokit/action@6.1.0'
  - '@octokit/endpoint@9.0.6'
  - '@octokit/plugin-paginate-rest@9.2.2'
  - chokidar@4.0.3
  - undici@5.29.0 || 6.22.0
packages:
  - playground
overrides:
  '@vue/compiler-core': 3.5.41
  vue-sfc-transformer: 'link:.'
catalogs:
  dev:
    '@antfu/eslint-config': 9.3.0
    '@babel/types': 7.29.8
    '@types/node': 24.13.3
    '@vitest/coverage-v8': 4.1.10
    '@volar/typescript': 2.4.28
    '@vue/compiler-dom': 3.5.41
    '@vue/compiler-sfc': 3.5.41
    '@vue/language-core': 3.3.9
    eslint: 10.8.0
    exsolve: 1.1.1
    installed-check: 10.0.1
    knip: 6.32.0
    lint-staged: 17.3.0
    mkdist: 2.4.1
    pkg-pr-new: 0.0.87
    rolldown: 1.2.3
    simple-git-hooks: 2.13.1
    tsdown: 0.22.14
    typescript: 6.0.3
    vitest: 4.1.10
    vue-tsc: 3.3.9
  peer:
    '@vue/compiler-core': 3.5.41
    esbuild: 0.28.2
    vue: 3.5.41
  prod:
    '@babel/parser': ^7.27.0
    pathe: ^2.0.3
    tinyglobby: ^0.2.16

allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  simple-git-hooks: true
